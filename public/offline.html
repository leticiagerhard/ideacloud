<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />

    <title>Ideacloud · sem conexão</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fbf7f0;
        color: #3d3a36;
        font-family: ui-rounded, system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      h1 { font-size: 1.5rem; margin: 0 0 8px; }
      p { color: #7a746b; margin: 0 0 20px; }
      button {
        font: inherit; font-weight: 700; border: 0; border-radius: 999px;
        background: #5e8070; color: #fff; padding: 14px 28px; min-height: 48px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>☁️ Sem conexão por agora</h1>
      <p>Suas ideias estão guardadas e seguras. Volte quando a internet voltar.</p>
      <button onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
